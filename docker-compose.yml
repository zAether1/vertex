version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vertex-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertex_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vertex_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-vertex}
    volumes:
      - vertex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vertex_admin} -d ${POSTGRES_DB:-vertex}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vertex_pgdata:
    driver: local
